name: Raievalvur - notify subscribers of domain change

# Ühekordne käsitsi käivitatav teavituskiri (vt scripts/notify-domain-change.js).
# Käivita Actions vahekaardilt "Run workflow". Pärast edukat käivitamist võib
# nii selle faili kui scripts/notify-domain-change.js kustutada.
on:
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Send domain-change notice
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: node notify-domain-change.js
